apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cilium

resources:
  - ../../base

patches:
  - target:
      group: cilium.io
      version: v2
      kind: CiliumLoadBalancerIPPool
      name: lb-pool
    path: lb-pool.yaml

  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: public
    path: gateway-public.yaml

  - target:
      group: cilium.io
      version: v2alpha1
      kind: CiliumL2AnnouncementPolicy
      name: l2-policy
    path: policy.yaml
