apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: core
  # Ordem fixa das fontes: Helm (0) -> repoData (1) -> Kustomize (2).
  # O overlay injeta repoURL/targetRevision em sources.1 e sources.2 via replacements;
  # mudar a ordem sem atualizar os replacements quebra o sync.
  sources:
    # Helm chart
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.19.3
      helm:
        releaseName: cert-manager
        valueFiles:
          - $repoData/k8s/core/cert-manager/base/values.yaml
          - PLACEHOLDER
    # repoData (values no Git)
    - repoURL: https://github.com/broetec/k8s-blueprint.git
      targetRevision: main
      ref: repoData
    # Kustomize (recursos extras do overlay)
    - repoURL: https://github.com/broetec/k8s-blueprint.git
      targetRevision: main
      path: PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 30
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: "*"
      kind: "Application"
      namespace: "*"
      jsonPointers:
        - /spec/syncPolicy/automated
        - /metadata/annotations/argocd.argoproj.io~1refresh
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - /operation
