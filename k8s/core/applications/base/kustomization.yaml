apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - project.yaml
  - core-apps.yaml
  - cluster-config.yaml
  - local-path-provisioner.yaml
  - sealed-secrets.yaml
  - cert-manager.yaml
  - external-secrets-operator.yaml
  - argocd.yaml

# Origem dos manifests (repositório Git + revisão). O overlay ajusta os valores
# em _release-source.yaml e os propaga para as Applications via replacements.
configMapGenerator:
  - name: core-release-source
    literals:
      - repoURL=https://github.com/broetec/k8s-blueprint.git
      - targetRevision=main
    options:
      disableNameSuffixHash: true
