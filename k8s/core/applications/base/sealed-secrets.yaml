apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: core
  # Ordem fixa das fontes: Helm (0) -> repoData (1).
  # O overlay injeta repoURL/targetRevision em sources.1 via replacements;
  # mudar a ordem sem atualizar os replacements quebra o sync.
  sources:
    # Helm chart
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: "2.18.3"
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $repoData/k8s/core/sealed-secrets/base/values.yaml
          - PLACEHOLDER
    # repoData (values no Git)
    - repoURL: https://github.com/broetec/k8s-blueprint.git
      targetRevision: main
      ref: repoData

  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 30
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: "*"
      kind: "Application"
      namespace: "*"
      jsonPointers:
        - /spec/syncPolicy/automated
        - /metadata/annotations/argocd.argoproj.io~1refresh
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - /operation
