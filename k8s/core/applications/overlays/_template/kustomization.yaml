apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../base
[% if 'storage' in stacks %]
  # Stack storage: AppProject + app-of-apps (k8s/storage/applications).
  - ../../../../storage/applications/root
[% endif %]

patches:
  - path: _release-source.yaml
    target:
      kind: ConfigMap
      name: core-release-source

  - path: core-apps.yaml
    target:
      kind: Application
      name: core-apps

  - path: cluster-config.yaml
    target:
      kind: Application
      name: cluster-config

  - path: local-path-provisioner.yaml
    target:
      kind: Application
      name: local-path-provisioner

  - path: sealed-secrets.yaml
    target:
      kind: Application
      name: sealed-secrets

  - path: cert-manager.yaml
    target:
      kind: Application
      name: cert-manager

  - path: argocd.yaml
    target:
      kind: Application
      name: argocd
[% if 'core/external-secrets-operator' in components %]

  - path: external-secrets-operator.yaml
    target:
      kind: Application
      name: external-secrets-operator
[% else %]

  # Componente opcional não selecionado neste overlay.
  - target:
      kind: Application
      name: external-secrets-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-secrets-operator
[% endif %]
[% if 'storage' in stacks %]

  - path: storage-apps.yaml
    target:
      kind: Application
      name: storage-apps
[% endif %]

# Propaga repoURL/targetRevision do ConfigMap core-release-source para as
# Applications (fontes Git) e para o AppProject.
replacements:
  - source:
      kind: ConfigMap
      name: core-release-source
      fieldPath: data.repoURL
    targets:
      - select:
          kind: AppProject
          name: core
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: Application
          name: core-apps
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: cluster-config
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: local-path-provisioner
        fieldPaths:
          - spec.sources.1.repoURL
          - spec.sources.2.repoURL
      - select:
          kind: Application
          name: sealed-secrets
        fieldPaths:
          - spec.sources.1.repoURL
      - select:
          kind: Application
          name: cert-manager
        fieldPaths:
          - spec.sources.1.repoURL
          - spec.sources.2.repoURL
      - select:
          kind: Application
          name: argocd
        fieldPaths:
          - spec.sources.1.repoURL
          - spec.sources.2.repoURL
[% if 'core/external-secrets-operator' in components %]
      - select:
          kind: Application
          name: external-secrets-operator
        fieldPaths:
          - spec.sources.1.repoURL
          - spec.sources.2.repoURL
[% endif %]
[% if 'storage' in stacks %]
      - select:
          kind: AppProject
          name: storage
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: Application
          name: storage-apps
        fieldPaths:
          - spec.source.repoURL
[% endif %]

  - source:
      kind: ConfigMap
      name: core-release-source
      fieldPath: data.targetRevision
    targets:
      - select:
          kind: Application
          name: core-apps
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: cluster-config
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: local-path-provisioner
        fieldPaths:
          - spec.sources.1.targetRevision
          - spec.sources.2.targetRevision
      - select:
          kind: Application
          name: sealed-secrets
        fieldPaths:
          - spec.sources.1.targetRevision
      - select:
          kind: Application
          name: cert-manager
        fieldPaths:
          - spec.sources.1.targetRevision
          - spec.sources.2.targetRevision
      - select:
          kind: Application
          name: argocd
        fieldPaths:
          - spec.sources.1.targetRevision
          - spec.sources.2.targetRevision
[% if 'core/external-secrets-operator' in components %]
      - select:
          kind: Application
          name: external-secrets-operator
        fieldPaths:
          - spec.sources.1.targetRevision
          - spec.sources.2.targetRevision
[% endif %]
[% if 'storage' in stacks %]
      - select:
          kind: Application
          name: storage-apps
        fieldPaths:
          - spec.source.targetRevision
[% endif %]
