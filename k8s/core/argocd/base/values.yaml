## Valores base para o chart argoproj/argo-cd
## Referência oficial de values:
##   https://artifacthub.io/packages/helm/argo/argo-cd

crds:
  install: true
  keep: true

global:
  priorityClassName: "pc-5-management-auth"

configs:
  secret:
    annotations:
      sealedsecrets.bitnami.com/patch: "true"
  cm:
    # Saúde de Application: sem isto o Argo CD não espera uma Application ficar
    # Healthy antes de avançar a sync-wave do app-of-apps.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

server:
  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: cilium
        sectionName: https
