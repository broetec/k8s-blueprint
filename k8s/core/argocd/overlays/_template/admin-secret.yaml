# Secret didático do lab (senha de aprendizado: "broetec").
#
# Gerar outro hash bcrypt:
#   htpasswd -nbBC 10 "" 'sua-senha' | tr -d ':\n' | sed 's/$2y/$2a/'
#
# O role 04 sela este arquivo em admin-sealedsecret.yaml com a chave BYOK de
# env/[[ overlay_id ]]/. Para selar à mão:
#   uv run k8s-blueprint-seal seal --cert env/[[ overlay_id ]]/sealed-secrets-pub.pem \
#     --in  k8s/core/argocd/overlays/[[ overlay_id ]]/admin-secret.yaml \
#     --out k8s/core/argocd/overlays/[[ overlay_id ]]/admin-sealedsecret.yaml
#
# A annotation "patch: true" faz merge no argocd-secret existente (criado pelo Helm),
# sem apagar campos como server.secretkey.
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    sealedsecrets.bitnami.com/patch: "true"
stringData:
  admin.password: $2a$10$Qm46Vs2hhZx5CHj5VqoWfuHtP1mML8vr7kL6b2jOutgVfpMDtHkHi
  admin.passwordMtime: "2026-01-01T00:00:00Z"
