apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../base

patches:
  - path: _release-source.yaml
    target:
      kind: ConfigMap
      name: storage-release-source

  - path: storage-secret-stores.yaml
    target:
      kind: Application
      name: storage-secret-stores

  - path: postgres-operator.yaml
    target:
      kind: Application
      name: postgres-operator

  - path: seaweedfs-db.yaml
    target:
      kind: Application
      name: seaweedfs-db

  - path: seaweedfs-cluster.yaml
    target:
      kind: Application
      name: seaweedfs-cluster

  - path: seaweedfs-operator.yaml
    target:
      kind: Application
      name: seaweedfs-operator

  - path: harbor-db.yaml
    target:
      kind: Application
      name: harbor-db

  - path: harbor.yaml
    target:
      kind: Application
      name: harbor

# Propaga repoURL/targetRevision do ConfigMap storage-release-source para as
# fontes Git das Applications.
replacements:
  - source:
      kind: ConfigMap
      name: storage-release-source
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
          name: storage-secret-stores
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: postgres-operator
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: seaweedfs-db
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: seaweedfs-cluster
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: seaweedfs-operator
        fieldPaths:
          - spec.sources.1.repoURL
          - spec.sources.2.repoURL
      - select:
          kind: Application
          name: harbor-db
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: harbor
        fieldPaths:
          - spec.sources.1.repoURL
          - spec.sources.2.repoURL

  - source:
      kind: ConfigMap
      name: storage-release-source
      fieldPath: data.targetRevision
    targets:
      - select:
          kind: Application
          name: storage-secret-stores
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: postgres-operator
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: seaweedfs-db
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: seaweedfs-cluster
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: seaweedfs-operator
        fieldPaths:
          - spec.sources.1.targetRevision
          - spec.sources.2.targetRevision
      - select:
          kind: Application
          name: harbor-db
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: harbor
        fieldPaths:
          - spec.sources.1.targetRevision
          - spec.sources.2.targetRevision
