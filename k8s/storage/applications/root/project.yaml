apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: storage
  namespace: argocd
spec:
  description: PostgreSQL, SeaweedFS (S3) e Harbor (stack storage)
  # O índice 0 é o repositório dos manifests: o overlay do core o substitui
  # pelo repoURL do ConfigMap core-release-source (replacements).
  sourceRepos:
    - "https://github.com/broetec/k8s-blueprint.git"
    - "https://helm.goharbor.io"
    - "https://seaweedfs.github.io/seaweedfs-operator/"

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: harbor
      server: https://kubernetes.default.svc
    - namespace: harbor-db
      server: https://kubernetes.default.svc
    - namespace: pgo
      server: https://kubernetes.default.svc
    - namespace: seaweedfs
      server: https://kubernetes.default.svc
    - namespace: seaweedfs-db
      server: https://kubernetes.default.svc
    - namespace: seaweedfs-operator
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
