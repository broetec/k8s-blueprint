apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-credentials
  namespace: harbor
spec:
  secretStoreRef:
    name: harbor-db
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: harbor-db-credentials
    creationPolicy: "Owner"
  data:
    - secretKey: password
      remoteRef:
        key: harbor-cr-1-pguser-harbor
        property: password
