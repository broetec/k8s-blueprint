apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3-credentials
  namespace: harbor
spec:
  secretStoreRef:
    name: seaweedfs
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: s3-secret
    creationPolicy: "Owner"
    template:
      type: Opaque
  data:
    - secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
      remoteRef:
        key: seaweedfs-s3-harbor-registry
        property: access-key
    - secretKey: REGISTRY_STORAGE_S3_SECRETKEY
      remoteRef:
        key: seaweedfs-s3-harbor-registry
        property: secret-key
