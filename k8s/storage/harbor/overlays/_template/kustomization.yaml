apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor

resources:
  - ../../base
  - users-sealedsecret.yaml

patches:
  - path: harbor-robot-creator-configmap.yaml
    target:
      kind: ConfigMap
      name: harbor-robot-creator-conf

  - path: httproute.yaml
    target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: harbor
