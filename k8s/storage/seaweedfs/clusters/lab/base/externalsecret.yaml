
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-filer-db-credentials
  namespace: seaweedfs
spec:
  secretStoreRef:
    name: seaweedfs-db
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: seaweedfs-filer-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: seaweedfs-cr-1-pguser-seaweedfs
        metadataPolicy: None
        property: password
