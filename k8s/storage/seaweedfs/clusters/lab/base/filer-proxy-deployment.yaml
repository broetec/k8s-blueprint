apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-lab-filer-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-lab-filer-proxy
  template:
    metadata:
      labels:
        app: seaweedfs-lab-filer-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8888
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: seaweedfs-lab-filer-proxy-nginx
        - name: auth
          secret:
            secretName: seaweedfs-lab-filer-proxy-basic-auth
