## Valores base para o chart seaweedfs/seaweedfs-operator
## https://github.com/seaweedfs/seaweedfs-operator

replicaCount: 1

port:
  name: http
  number: 8080

service:
  portName: http
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 100m
    memory: 50Mi

webhook:
  enabled: false

grafanaDashboard:
  enabled: false

serviceMonitor:
  enabled: false

rbac:
  serviceAccount:
    create: true
    automount: true
