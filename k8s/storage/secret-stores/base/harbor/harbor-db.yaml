apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secret-reader-role
  namespace: harbor-db
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secret-reader-binding
  namespace: harbor-db
subjects:
  - kind: ServiceAccount
    name: external-secrets-operator
    namespace: external-secrets
roleRef:
  kind: Role
  name: eso-secret-reader-role
  apiGroup: rbac.authorization.k8s.io
---
# Lê Secrets do namespace harbor-db para ExternalSecrets de outros namespaces.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: harbor-db
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor-db
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: external-secrets-operator
          namespace: external-secrets
