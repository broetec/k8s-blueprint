# =============================================================================
# manifest.yml — Overlay source of truth for generated inventory
# =============================================================================
#
# Purpose
#   Declares lab overlays (VM name, IP, role). Generator writes hosts.ini and
#   50_overlay.generated.yml per overlay.
#
# Schema
#   defaults     — connection settings for [kvm_hosts] and [vms:vars]
#   overlays     — map of overlay id → label, role, vms[], optional vars{}
#   vms[].name   — libvirt domain name (--name)
#   vms[].ip     — static guest IP (cloud-init network-config)
#   vms[].mac    — optional; derived as 52:54:00:<md5(name)> if omitted
#   k8s          — optional; Kubernetes selection rendered by `k8s-blueprint`
#     stacks     — stacks from k8s/catalog.yml (core is always required)
#     disable    — optional components to leave out (<stack>/<component>)
#     domain     — apps domain; hostnames are <app>.<domain>
#     tls_issuer — ClusterIssuer of the Gateway (letsencrypt-prod | selfsigned)
#     argo_source— local (Git served by the node, default) | remote
#
# Local overlays
#   Overlays created with `k8s-blueprint overlay new` live in the gitignored
#   manifest.local.yml (same schema) and are merged with this file.
#
# Regenerate
#   make inventory              # all overlays
#   make inventory OVERLAY=id   # one overlay
#
# env/.env overrides (active OVERLAY only)
#   VM_NAME, VM_IP — see app/inventory/env_file.py
#   ANSIBLE_VM_CONNECTION=ssh|libssh — VM connection plugin
#
# Related
#   provisioning/inventory/README.md, app/inventory/README.md
# =============================================================================

defaults:
  kvm_host: localhost
  ansible_connection: local
  ansible_user: broetec
  ansible_connection_vm: libssh
  ansible_host_key_checking: false
  ansible_libssh_host_key_auto_add: true
  ansible_libssh_config_file: env/ssh_config_lab

overlays:
  broetec-core:
    label: Core node (control plane / lab reference)
    role: core
    vms:
      - name: broetec-core
        ip: 10.20.30.40
    k8s:
      stacks: [core]
      domain: core.local.broetec.com.br
      tls_issuer: letsencrypt-prod

  broetec-storage:
    label: Storage node
    role: storage
    vms:
      - name: broetec-storage
        ip: 10.20.30.50
    k8s:
      stacks: [core, storage]
      domain: storage.local.broetec.com.br
      tls_issuer: letsencrypt-prod

  broetec-monitor:
    label: Telemetry / monitoring node
    role: monitor
    vms:
      - name: broetec-monitor
        ip: 10.20.30.60
    k8s:
      stacks: [core]
      domain: monitor.local.broetec.com.br
      tls_issuer: letsencrypt-prod

  # Temporary builder VM for `make golden` (role golden_image). Not a lab node:
  # it is prepared by role 02, sealed, exported to lab/cache/ and destroyed.
  golden:
    label: Golden image builder (make golden)
    role: golden
    vms:
      - name: golden-builder
        ip: 10.20.30.250
