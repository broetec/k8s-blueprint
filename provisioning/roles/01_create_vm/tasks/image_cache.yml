---
# =============================================================================
# tasks/image_cache.yml — Rocky Linux cloud image cache
# =============================================================================
#
# Purpose
#   Ensure lab storage directories exist, download the base qcow2 once, and
#   select the backing image for new VM disks (vm_base_image): the golden image
#   when it exists and use_golden is true, otherwise the raw Rocky image.
#
# Variables
#   libvirt_pool.path, os_image (url, filename, cache_dir), kvm_host_libvirt_user,
#   golden_image.filename, use_golden.
#
# Related commands
#   make create-vm, make up
# =============================================================================

- name: Ensure lab libvirt directories exist (disks + image cache)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kvm_host_libvirt_user }}"
    mode: "0755"
  loop:
    - "{{ libvirt_pool.path }}"
    - "{{ os_image.cache_dir }}"
  check_mode: false

- name: Download Rocky Linux qcow2 cloud image (once)
  ansible.builtin.get_url:
    url: "{{ os_image.url }}"
    dest: "{{ os_image.cache_dir }}/{{ os_image.filename }}"
    mode: "0644"
    force: false

- name: Check for a golden image in the cache
  ansible.builtin.stat:
    path: "{{ os_image.cache_dir }}/{{ golden_image.filename }}"
  register: golden_image_stat
  check_mode: false

- name: Select backing image for new VM disks (golden when present and enabled)
  ansible.builtin.set_fact:
    vm_base_image: >-
      {{ os_image.cache_dir ~ '/' ~
         (golden_image.filename
          if (use_golden | default(true) | bool and golden_image_stat.stat.exists)
          else os_image.filename) }}
