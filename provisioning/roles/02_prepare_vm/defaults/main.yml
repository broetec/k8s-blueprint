---
# =============================================================================
# defaults/main.yml — Role 02 defaults
# =============================================================================
#
# Purpose
#   Tunables for OS baseline inside each VM (overridden via inventory or -e).
#
# Variables
#   prepare_vm_selinux_mode       — SELINUX= value in /etc/selinux/config; setenforce at runtime when enforcing/permissive.
#   prepare_vm_dnf_*              — dnf.conf tuning, update, reboot, EPEL (see tasks/dnf.yml).
#   prepare_vm_packages           — auxiliary RPMs for VM day-to-day use (htop, etc.; requires EPEL).
#   prepare_vm_qemu_guest_agent   — install and enable qemu-guest-agent (true/false).
#   prepare_vm_zsh                — shell selector only: true installs zsh + Oh My Zsh and writes the k8s shell block to .zshrc; false writes the same block to .bashrc. K8s CLI tooling (git, Helm, kubectx/kubens) is always installed by tasks/k8s_tools.yml.
#
# Inventory (not duplicated here)
#   cloud_init (sudo_nopasswd, default_user), ansible_user — see
#   provisioning/inventory/_shared/group_vars/all.yml and hosts.ini.
#
# Related commands
#   make prepare-vm, make up
# =============================================================================

prepare_vm_selinux_mode: enforcing

# DNF bootstrap (tasks/dnf.yml) — runs before swap/iptables and other package installs.
prepare_vm_dnf_max_parallel_downloads: 10
prepare_vm_dnf_update: true
prepare_vm_reboot_after_update: true
prepare_vm_epel: true

# Auxiliary packages for VM day-to-day use (not required for k8s).
# Append RPM names here as the lab needs more tooling.
prepare_vm_packages:
  - htop
  - nano
  - net-tools

# Shell selector for the k8s environment (KUBECONFIG, kubectl/helm completions,
# k/kns/kctx aliases). When true, install zsh + Oh My Zsh + zsh-autosuggestions
# and write the block to .zshrc; when false, write the same block to .bashrc.
# The k8s CLI tooling (git, Helm, kubectx/kubens system-wide) is always
# installed by tasks/k8s_tools.yml, independent of this flag.
# Requires internet access from the VM.
prepare_vm_zsh: true

# Install and enable qemu-guest-agent for hypervisor integration
# (virsh guestinfo, snapshot quiescing, graceful shutdown).
# Set false on bare-metal or when the hypervisor does not expose the
# virtio-serial channel (e.g. some nested-virt setups).
prepare_vm_qemu_guest_agent: true

# Kernel settings written to /etc/sysctl.d/90-k8s.conf.
# Required by both k3s and RKE2; applied in tasks/sysctl.yml.
prepare_vm_sysctl_settings:
  net.ipv4.ip_forward: 1
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 1024
