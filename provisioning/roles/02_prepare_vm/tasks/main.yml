---
# =============================================================================
# tasks/main.yml — Role 02 entrypoint (VM OS baseline)
# =============================================================================
#
# Purpose
#   Prepare Rocky Linux inside each VM (groups['vms']) for later k8s roles:
#   DNF bootstrap (dnf.conf, update, EPEL), auxiliary packages, swap off,
#   SELinux, iptables baseline (firewalld off), k8s sysctl,
#   qemu-guest-agent, zsh + Oh My Zsh + kubectx. Does not install platform software.
#
# Pipeline
#   1. preflight.yml         — SSH ping without become; primary NIC fact.
#   2. cloud_init.yml        — wait for cloud-init.
#   3. dnf.yml               — dnf.conf tuning, dnf update, reboot, epel-release.
#   4. packages.yml          — auxiliary RPMs (htop, etc.; prepare_vm_packages).
#   5. swap.yml              — swapoff + /etc/fstab.
#   6. selinux.yml           — SELINUX mode.
#   7. iptables.yml          — mask firewalld; install iptables/iptables-nft.
#   8. sysctl.yml            — ip_forward, inotify limits (required by k3s + RKE2).
#   9. qemu_guest_agent.yml  — install + enable qemu-guest-agent (opt-out via default).
#  10. zsh.yml               — zsh, Oh My Zsh, zsh-autosuggestions, kubectx/kubens (opt-out).
#
# Variables
#   prepare_vm_selinux_mode, prepare_vm_dnf_*, prepare_vm_packages,
#   prepare_vm_qemu_guest_agent, prepare_vm_zsh (defaults/main.yml).
#
# Related commands
#   make prepare-vm, make up
# =============================================================================

- name: Preflight — SSH connectivity and host facts
  ansible.builtin.import_tasks: preflight.yml
  tags: [prepare_vm]

- name: Cloud-init — wait for first-boot configuration
  ansible.builtin.import_tasks: cloud_init.yml
  tags: [prepare_vm]

- name: DNF — system update and EPEL
  ansible.builtin.import_tasks: dnf.yml
  tags: [prepare_vm]

- name: Packages — auxiliary CLI tools for VM use
  ansible.builtin.import_tasks: packages.yml
  tags: [prepare_vm]

- name: Swap — disable runtime and persist in fstab
  ansible.builtin.import_tasks: swap.yml
  tags: [prepare_vm]

- name: SELinux — set lab mode
  ansible.builtin.import_tasks: selinux.yml
  tags: [prepare_vm]

- name: Iptables — disable firewalld and install tooling
  ansible.builtin.import_tasks: iptables.yml
  tags: [prepare_vm]

- name: Sysctl — kernel tuning for Kubernetes
  ansible.builtin.import_tasks: sysctl.yml
  tags: [prepare_vm]

- name: QEMU Guest Agent — hypervisor integration
  when: prepare_vm_qemu_guest_agent | bool
  ansible.builtin.import_tasks: qemu_guest_agent.yml
  tags: [prepare_vm]

- name: Zsh — shell, Oh My Zsh and kubectx/kubens
  when: prepare_vm_zsh | bool
  ansible.builtin.import_tasks: zsh.yml
  tags: [prepare_vm]
