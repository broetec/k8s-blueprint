---
# =============================================================================
# tasks/zsh.yml — zsh shell and Oh My Zsh setup
# =============================================================================
#
# Purpose
#   Install zsh and set it as the default shell for ansible_user, then install
#   Oh My Zsh + zsh-autosuggestions and write the "k8s shell" block to .zshrc
#   (KUBECONFIG, kubectl/helm completions, k/kns/kctx aliases, kubectx zsh
#   completions). The Kubernetes CLI tooling itself (git, helm, kubectx/kubens)
#   is installed unconditionally by tasks/k8s_tools.yml.
#
# Scope
#   Package install and default-shell change run as root (play-level become).
#   The remaining tasks run as ansible_user (become_user) to write dotfiles to
#   the correct home and avoid root-owned files.
#   Oh My Zsh install script requires internet access from the VM and runs with
#   RUNZSH=no CHSH=no to avoid spawning an interactive shell.
#   Idempotent: stat checks skip Oh My Zsh when already installed; lineinfile/
#   blockinfile markers prevent duplicate .zshrc blocks.
#   The k8s shell block uses `|| true` on completions so login still works when
#   binaries are not present yet. RKE2 bin PATH is added only when
#   k8s_distribution is rke2 (k3s puts kubectl in /usr/local/bin).
#
# Variables
#   prepare_vm_zsh       — bool; when false this file is skipped (defaults/main.yml).
#   prepare_vm_user_home — home of ansible_user, set by tasks/k8s_tools.yml.
#   ansible_user         — the OS user that receives the shell configuration.
#   k8s_distribution     — rke2 | k3s (inventory group_vars); controls RKE2 PATH line.
#
# Related commands
#   make prepare-vm, make up
# =============================================================================

# ---------------------------------------------------------------------------
# System-level (root)
# ---------------------------------------------------------------------------

- name: "zsh | Install zsh package"
  ansible.builtin.package:
    name: zsh
    state: present

- name: "zsh | Set zsh as default shell for {{ ansible_user }}"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh

# ---------------------------------------------------------------------------
# User-level (ansible_user)
# ---------------------------------------------------------------------------

- name: "zsh | Check if Oh My Zsh is already installed"
  become_user: "{{ ansible_user }}"
  ansible.builtin.stat:
    path: "{{ prepare_vm_user_home }}/.oh-my-zsh"
  register: _omz_dir

- name: "zsh | Install Oh My Zsh (non-interactive)"
  when: not _omz_dir.stat.exists
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell:
    cmd: >
      RUNZSH=no CHSH=no
      sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    executable: /bin/bash
  changed_when: true

- name: "zsh | Clone zsh-autosuggestions plugin"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "{{ prepare_vm_user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: master
    update: false

- name: "zsh | Configure HIST_STAMPS in .zshrc"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "{{ prepare_vm_user_home }}/.zshrc"
    regexp: '^#?\s*HIST_STAMPS='
    line: 'HIST_STAMPS="yyyy-mm-dd"'

- name: "zsh | Enable git and zsh-autosuggestions plugins in .zshrc"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "{{ prepare_vm_user_home }}/.zshrc"
    regexp: '^plugins=\(.*\)'
    line: 'plugins=(git zsh-autosuggestions)'

- name: "zsh | Add k8s shell environment to .zshrc"
  become_user: "{{ ansible_user }}"
  ansible.builtin.blockinfile:
    path: "{{ prepare_vm_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED — k8s shell"
    block: |
      {% if (k8s_distribution | default('rke2')) == 'rke2' %}
      export PATH=$PATH:/var/lib/rancher/rke2/bin
      {% endif %}
      export KUBECONFIG=$HOME/.kube/config
      alias k='kubectl'
      alias kns='kubens'
      alias kctx='kubectx'
      source <(kubectl completion zsh) 2>/dev/null || true
      source <(helm completion zsh) 2>/dev/null || true
      if [ -d "$HOME/.oh-my-zsh" ]; then
        mkdir -p "$HOME/.oh-my-zsh/custom/completions"
        ln -sf "/opt/kubectx/completion/_kubens.zsh" \
          "$HOME/.oh-my-zsh/custom/completions/_kubens.zsh" 2>/dev/null || true
        ln -sf "/opt/kubectx/completion/_kubectx.zsh" \
          "$HOME/.oh-my-zsh/custom/completions/_kubectx.zsh" 2>/dev/null || true
      fi
