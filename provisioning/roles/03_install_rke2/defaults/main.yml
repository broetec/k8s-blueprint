---
# =============================================================================
# defaults/main.yml — Role 03_install_rke2 defaults
# =============================================================================
#
# Purpose
#   Tunables for the RKE2 installation (overridden via inventory or -e).
#   All variables are prefixed with rke2_ to avoid collisions with other roles.
#
# Variables
#   rke2_version          — pin installer version; empty = latest from channel.
#   rke2_channel          — install channel: stable | latest | testing | v1.NN.
#   rke2_install_url      — official install script URL.
#   rke2_node_name        — node name registered in the cluster (default: inventory hostname).
#   rke2_node_ip          — IP for intra-cluster traffic; defaults to vm_ip from inventory.
#   rke2_advertise_address — IP advertised to other nodes; usually equals rke2_node_ip.
#   rke2_tls_san          — extra SANs for the API server TLS cert (list).
#   rke2_cni              — CNI plugin (cilium).
#   rke2_disable_kube_proxy — let Cilium replace kube-proxy.
#   rke2_disable          — list of built-in RKE2 components to skip.
#   rke2_secrets_encryption — encrypt secrets at rest in etcd.
#   rke2_write_kubeconfig_mode — file permissions for rke2.yaml.
#   rke2_etcd_snapshot_*  — etcd snapshot schedule and retention settings.
#   rke2_control_plane_resource_* — CPU/memory requests and limits for static pods.
#   rke2_cilium_version   — pin Cilium image tag; empty = use RKE2-bundled chart version.
#   rke2_cilium_operator_replicas — 1 avoids port conflicts on single-node clusters.
#   rke2_cilium_kube_proxy_replacement — must be true when rke2_disable_kube_proxy is true.
#   rke2_cilium_gateway_api_enabled — expose Gateway API via Cilium.
#   rke2_kubeconfig_user  — OS user that receives the kubeconfig.
#
# Inventory (not duplicated here)
#   vm_ip, ansible_host, ansible_user — see
#   provisioning/inventory/_shared/group_vars/all.yml and hosts.ini.
#
# Related commands
#   make install-rke2 [RKE2_VERSION=vX.Y.Z+rke2rN], make deploy, make up
# =============================================================================

# -----------------------------------------------------------------------------
# Version & install
# -----------------------------------------------------------------------------
# Pinned so that recreating a VM always gives the same cluster (an unpinned
# `stable` channel moved from v1.35 to v1.36 and broke the pipeline).
# Bump deliberately; keep rke2_cilium_version and the Gateway API CRDs
# (k8s/core/cluster-config/gateway-api) in step with the Cilium chart it bundles.
# Empty string = latest patch of rke2_channel.
rke2_version: "v1.36.5+rke2r1"

# Channel: stable | latest | testing | v1.NN (minor pin). Only used when
# rke2_version is empty.
rke2_channel: v1.36

# Install script URL (official).
rke2_install_url: https://get.rke2.io

# -----------------------------------------------------------------------------
# Node identity
# -----------------------------------------------------------------------------
rke2_node_name: "{{ inventory_hostname }}"

# IP used for intra-cluster traffic (and advertised to peers).
# Defaults to the VM inventory IP when available.
rke2_node_ip: "{{ vm_ip | default(ansible_host) }}"
rke2_advertise_address: "{{ rke2_node_ip }}"

# Extra Subject Alternative Names for the API server TLS cert.
# The node IP and node name are always included by RKE2; list only extras here.
# Example: ["k8s.local.broetec.com.br", "10.20.30.40"]
rke2_tls_san: []

# -----------------------------------------------------------------------------
# Networking
# -----------------------------------------------------------------------------
rke2_cni: cilium
rke2_disable_kube_proxy: true

# -----------------------------------------------------------------------------
# Components to disable (RKE2 built-ins)
# -----------------------------------------------------------------------------
# Ingress is the Cilium Gateway API (role 04 cluster-config), so every bundled
# ingress controller is disabled: ingress-nginx (default up to v1.35) and
# Traefik (default from v1.36). rke2-traefik-crd installs its own Gateway API
# CRDs, which conflict with the ones role 04 applies.
rke2_disable:
  - rke2-ingress-nginx
  - rke2-traefik
  - rke2-traefik-crd

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
rke2_secrets_encryption: true
rke2_write_kubeconfig_mode: "0644"

# -----------------------------------------------------------------------------
# etcd snapshots
# -----------------------------------------------------------------------------
rke2_etcd_snapshot_schedule_cron: "0 2,8,14,20 * * *"
rke2_etcd_snapshot_retention: 5
rke2_etcd_snapshot_compress: false

# -----------------------------------------------------------------------------
# Control plane resources (static pods)
# -----------------------------------------------------------------------------
# Maps to control-plane-resource-requests / control-plane-resource-limits in
# /etc/rancher/rke2/config.yaml. Default [] = omit from generated config.
# Override via inventory when tuning (see role README).
rke2_control_plane_resource_requests: []
# rke2_control_plane_resource_requests:
#   - kube-apiserver=cpu=250m,memory=512Mi
#   - etcd=cpu=500m,memory=1Gi
#   - kube-controller-manager=cpu=200m,memory=256Mi
#   - kube-scheduler=cpu=100m,memory=128Mi

rke2_control_plane_resource_limits: []
# rke2_control_plane_resource_limits:
#   - kube-apiserver=cpu=1000m,memory=1Gi
#   - etcd=cpu=1000m,memory=2Gi
#   - kube-controller-manager=cpu=500m,memory=512Mi
#   - kube-scheduler=cpu=300m,memory=256Mi

# -----------------------------------------------------------------------------
# Cilium (HelmChartConfig)
# -----------------------------------------------------------------------------
# Pin to a specific Cilium version.  Empty = use whatever RKE2 bundles.
# v1.20.2 is the version RKE2 v1.36.5 bundles (chart rke2-cilium 1.20.200), so
# images and chart templates match. The 1.19 series was skipped: cilium#44430
# (>= 1.19.0, < 1.20.0) broke SSH to the node and outbound host traffic.
rke2_cilium_version: "v1.20.2"

# 1 replica avoids port conflicts (9234, 9963) on single-node clusters.
rke2_cilium_operator_replicas: 1

# kubeProxyReplacement: enable when rke2_disable_kube_proxy is true.
rke2_cilium_kube_proxy_replacement: true

# Gateway API integration (GatewayClass creation delegated to manifests).
rke2_cilium_gateway_api_enabled: true

# -----------------------------------------------------------------------------
# User access (kubeconfig)
# -----------------------------------------------------------------------------
# Linux user that will receive the kubeconfig (shell profile: role 02_prepare_vm).
rke2_kubeconfig_user: "{{ ansible_user }}"

# -----------------------------------------------------------------------------
# Fine tuning (tasks/fine_tuning.yml — see role README)
# -----------------------------------------------------------------------------
# Master switch for tasks/fine_tuning.yml (systemd hardening + optional watchdog).
rke2_fine_tuning_enabled: true

# rke2-server.service drop-in (CPU/I/O priority + resilient auto-restart).
rke2_systemd_hardening: true
rke2_systemd_nice: -10
rke2_systemd_io_scheduling_class: 2
rke2_systemd_io_scheduling_priority: 0
rke2_systemd_restart_sec: "15s"
rke2_systemd_timeout_start_sec: "20min"
rke2_systemd_timeout_stop_sec: "2min"
rke2_systemd_start_limit_interval_sec: 0
rke2_systemd_start_limit_burst: 0

# External API health watchdog (opt-in; aggressive on single-node clusters).
rke2_healthcheck_enabled: false
rke2_healthcheck_install_conntrack: true
rke2_healthcheck_timer_on_boot_sec: "10min"
rke2_healthcheck_timer_interval: "5min"
rke2_healthcheck_wait_api_seconds: 600

# -----------------------------------------------------------------------------
# local-path-provisioner (optional bootstrap deploy)
# -----------------------------------------------------------------------------
# Node directory created before RKE2 starts (mkdir + chmod 1777 + SELinux
# container_file_t).  Must match nodePathMap.paths[0] in
# k8s/core/local-path-provisioner/base/values.yaml.  Empty = skip OS prep.
# Defaults to /opt/local-path-provisioner so the node is always ready for the
# cluster-level deploy done by role 04 (04_deploy_k8s/tasks/local_path.yml).
rke2_local_path_dir: "/opt/local-path-provisioner"

# NOTE: the cluster-level deploy (namespace + Helm) moved to role 04
# (04_deploy_k8s/tasks/local_path.yml), gated on runtime rke2 detection. The
# former rke2_local_path_deploy / rke2_local_path_overlay /
# rke2_local_path_chart_version variables are no longer used by this role; see
# deploy_k8s_local_path_* in 04_deploy_k8s/defaults/main.yml.
