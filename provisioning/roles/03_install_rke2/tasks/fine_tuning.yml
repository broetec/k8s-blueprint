---
# =============================================================================
# tasks/fine_tuning.yml — RKE2 host fine-tuning (optional API watchdog)
# =============================================================================
#
# Purpose
#   Apply VPS-oriented resilience tuning after rke2-server is installed and
#   the node is Ready: optional external API health watchdog with gradual
#   escalation and Cilium data-plane reconcile.
#   The systemd drop-in (CPU/I/O priority, resilient auto-restart) lives in
#   systemd.yml and is written before the first start.
#
# Scope
#   Runs after install.yml (cluster Ready). The healthcheck timer only acts at
#   runtime when /readyz fails — it does not reconcile Cilium during the
#   Ansible play.
#
# Variables
#   rke2_fine_tuning_enabled, rke2_healthcheck_enabled, rke2_healthcheck_*
#   (defaults/main.yml).
#
# Related commands
#   make install-rke2, make deploy, make up
#   ansible-playbook ... --tags rke2_fine_tuning
# =============================================================================

# --- optional API health watchdog -------------------------------------------------------------

- name: "RKE2 fine-tuning | Install conntrack-tools for healthcheck reconcile"
  when:
    - rke2_healthcheck_enabled | bool
    - rke2_healthcheck_install_conntrack | bool
  ansible.builtin.dnf:
    name: conntrack-tools
    state: present

- name: "RKE2 fine-tuning | Deploy rke2-healthcheck.sh"
  when: rke2_healthcheck_enabled | bool
  ansible.builtin.template:
    src: rke2-healthcheck.sh.j2
    dest: /usr/local/sbin/rke2-healthcheck.sh
    owner: root
    group: root
    mode: "0755"

- name: "RKE2 fine-tuning | Deploy rke2-healthcheck.service unit"
  when: rke2_healthcheck_enabled | bool
  ansible.builtin.copy:
    dest: /etc/systemd/system/rke2-healthcheck.service
    content: |
      # Managed by Ansible — role 03_install_rke2.
      [Unit]
      Description=RKE2 API health check
      After=rke2-server.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/rke2-healthcheck.sh
    owner: root
    group: root
    mode: "0644"

- name: "RKE2 fine-tuning | Deploy rke2-healthcheck.timer unit"
  when: rke2_healthcheck_enabled | bool
  ansible.builtin.template:
    src: rke2-healthcheck.timer.j2
    dest: /etc/systemd/system/rke2-healthcheck.timer
    owner: root
    group: root
    mode: "0644"

- name: "RKE2 fine-tuning | Enable and start rke2-healthcheck.timer"
  when: rke2_healthcheck_enabled | bool
  ansible.builtin.systemd:
    name: rke2-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
