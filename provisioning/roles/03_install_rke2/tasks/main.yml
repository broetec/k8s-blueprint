---
# =============================================================================
# tasks/main.yml — Role 03_install_rke2 entrypoint
# =============================================================================
#
# Purpose
#   Install and configure RKE2 (single-node server) on Rocky Linux VMs.
#   Assumes 02_prepare_vm has already run (swap off, SELinux, firewalld off,
#   iptables tooling, sysctl). Does not touch the host KVM or other VMs.
#
# Pipeline
#   1. preflight.yml        — NetworkManager: ignore Cilium/CNI virtual interfaces.
#   2. config.yml           — /etc/rancher/rke2/config.yaml + Cilium HelmChartConfig
#                             under /var/lib/rancher/rke2/server/manifests/.
#   3. local_path.yml       — (opt-in) node directory for local-path-provisioner:
#                             mkdir + chmod 1777 + SELinux container_file_t.
#   4. install.yml          — download get.rke2.io, enable rke2-server.service,
#                             wait until node status = Ready (up to 10 min).
#   5. fine_tuning.yml      — (opt-in) systemd drop-in hardening + optional API
#                             health watchdog (see role README).
#   6. user_access.yml      — copy kubeconfig to ~/.kube/config.
#   7. local_path_deploy.yml — (opt-in) namespace PSA + Helm chart deploy of
#                             local-path-provisioner (requires cluster Ready).
#
# Variables
#   rke2_version, rke2_channel, rke2_node_ip, rke2_tls_san, rke2_cni,
#   rke2_disable, rke2_cilium_version, rke2_kubeconfig_user,
#   rke2_fine_tuning_enabled, rke2_systemd_hardening, rke2_healthcheck_enabled,
#   rke2_local_path_dir, rke2_local_path_deploy, rke2_local_path_overlay,
#   rke2_local_path_chart_version (all in defaults/main.yml).
#
# Tags
#   rke2_preflight, rke2_config, rke2_install, rke2_fine_tuning, rke2_user,
#   rke2_local_path
#   Parent tag install_k8s / install_rke2 set in site.yml.
#
# Related commands
#   make install-rke2, make deploy, make up
# =============================================================================

- name: "RKE2 | Connectivity check"
  become: false
  ansible.builtin.ping:
  tags: [rke2_preflight]

- name: "RKE2 | System preflight (NetworkManager)"
  ansible.builtin.import_tasks: preflight.yml
  tags: [rke2_preflight]

- name: "RKE2 | Write config files"
  ansible.builtin.import_tasks: config.yml
  tags: [rke2_config]

- name: "RKE2 | Prepare local-path-provisioner node directory"
  when: rke2_local_path_dir | length > 0
  ansible.builtin.import_tasks: local_path.yml
  tags: [rke2_local_path]

- name: "RKE2 | Install and start rke2-server"
  ansible.builtin.import_tasks: install.yml
  tags: [rke2_install]

- name: "RKE2 | Fine-tuning (systemd hardening + optional healthcheck)"
  when: rke2_fine_tuning_enabled | bool
  ansible.builtin.import_tasks: fine_tuning.yml
  tags: [rke2_fine_tuning]

- name: "RKE2 | Configure user access (kubeconfig)"
  become: false
  ansible.builtin.import_tasks: user_access.yml
  tags: [rke2_user]

- name: "RKE2 | Deploy local-path-provisioner (namespace + Helm)"
  become: false
  when: rke2_local_path_deploy | bool
  ansible.builtin.import_tasks: local_path_deploy.yml
  tags: [rke2_local_path]
