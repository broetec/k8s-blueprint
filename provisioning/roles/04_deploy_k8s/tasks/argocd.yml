---
# =============================================================================
# tasks/argocd.yml — Argo CD bootstrap (Helm)
# =============================================================================
#
# Purpose
#   Install Argo CD with the same chart version, release name (`argocd`) and
#   value files used by the `argocd` Application, so Argo CD adopts its own
#   installation as soon as the root Application is applied.
#
#   The admin password comes from admin-sealedsecret.yaml (Kustomize source of
#   the `argocd` Application): the Sealed Secrets controller patch-merges it
#   into the chart-managed argocd-secret (annotation patch: "true"). Until that
#   sync happens the chart-generated argocd-initial-admin-secret is valid.
#
# Scope
#   become: false — kubectl/helm run as the connecting user.
# =============================================================================

- name: "argocd | Add Helm repo {{ argocd_repo_name }}"
  become: false
  kubernetes.core.helm_repository:
    name: "{{ argocd_repo_name }}"
    repo_url: "{{ argocd_repo_url }}"

- name: "argocd | Install Argo CD"
  become: false
  kubernetes.core.helm:
    name: argocd
    chart_ref: "{{ argocd_repo_name }}/argo-cd"
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values_files:
      - "{{ deploy_k8s_k8s_path }}/core/argocd/base/values.yaml"
      - "{{ deploy_k8s_k8s_path }}/core/argocd/overlays/{{ deploy_k8s_overlay }}/values.yaml"
    wait: true
