---
# =============================================================================
# tasks/cluster_config.yml — Cilium config + PriorityClasses (README §3.0)
# =============================================================================
#
# Purpose
#   Apply the cluster-wide baseline: Gateway API CRDs, Cilium Gateway/LB pool/
#   L2 policy and the PriorityClasses consumed by the rest of the stack.
#   Server-side apply is required for the large Gateway API CRDs.
#
#   Gateway API CRDs must be Established before Gateway/GatewayClass resources;
#   a single kubectl apply -k on the full overlay races and fails on first run.
#
#   cilium-operator only enables the Gateway API kinds whose CRDs exist when it
#   starts (ListenerSet, TCPRoute and UDPRoute are optional). The operator is
#   restarted whenever the CRD bundle (version/channel annotations) changes:
#   first install on a fresh cluster, a new release or a channel switch in
#   gateway-api/kustomization.yaml.
#
# Scope
#   become: false — runs kubectl as the connecting user (kubeconfig at
#   ~/.kube/config). The overlay is the synced copy on the VM.
# =============================================================================

- name: "cluster_config | Read the installed Gateway API bundle (version/channel)"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl get crd gatewayclasses.gateway.networking.k8s.io --ignore-not-found
      -o 'jsonpath={.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}/{.metadata.annotations.gateway\.networking\.k8s\.io/channel}'
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  register: _deploy_k8s_gateway_api_before
  changed_when: false

- name: "cluster_config | Apply Gateway API CRDs (server-side)"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side -k
      {{ deploy_k8s_k8s_path }}/core/cluster-config/gateway-api
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true

- name: "cluster_config | Wait for Gateway API CRDs to be Established"
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    crds=$(kubectl get crd -o name | grep -E 'gateway\.networking\.(x-)?k8s\.io' || true)
    if [ -z "$crds" ]; then
      echo "No Gateway API CRDs found" >&2
      exit 1
    fi
    for crd in $crds; do
      kubectl wait --for=condition=Established "$crd" --timeout={{ deploy_k8s_gateway_api_crd_wait_seconds }}s
    done
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: false

- name: "cluster_config | Read the Gateway API bundle (version/channel) after the apply"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl get crd gatewayclasses.gateway.networking.k8s.io
      -o 'jsonpath={.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}/{.metadata.annotations.gateway\.networking\.k8s\.io/channel}'
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  register: _deploy_k8s_gateway_api_after
  changed_when: false

- name: "cluster_config | Restart cilium-operator when the Gateway API bundle changed"
  become: false
  when: _deploy_k8s_gateway_api_before.stdout != _deploy_k8s_gateway_api_after.stdout
  ansible.builtin.shell: |
    set -euo pipefail
    if kubectl -n kube-system get deploy cilium-operator >/dev/null 2>&1; then
      kubectl -n kube-system rollout restart deploy/cilium-operator
      kubectl -n kube-system rollout status deploy/cilium-operator --timeout=180s
    fi
    echo "Gateway API bundle: '{{ _deploy_k8s_gateway_api_before.stdout }}' -> '{{ _deploy_k8s_gateway_api_after.stdout }}'"
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true

# --force-conflicts: on a re-run these objects already belong to the
# `cluster-config` Application (field manager argocd-controller). Both sides
# apply the same files, so taking the fields back is harmless and Argo CD
# reclaims them on its next sync.
- name: "cluster_config | Apply Cilium + PriorityClasses overlay (server-side)"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts -k
      {{ deploy_k8s_k8s_path }}/core/cluster-config/overlays/{{ deploy_k8s_overlay }}
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true
