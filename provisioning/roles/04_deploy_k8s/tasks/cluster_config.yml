---
# =============================================================================
# tasks/cluster_config.yml — Cilium config + PriorityClasses (README §3.0)
# =============================================================================
#
# Purpose
#   Apply the cluster-wide baseline: Gateway API CRDs, Cilium Gateway/LB pool/
#   L2 policy and the PriorityClasses consumed by the rest of the stack.
#   Server-side apply is required for the large Gateway API CRDs.
#
#   Gateway API CRDs must be Established before Gateway/GatewayClass resources;
#   a single kubectl apply -k on the full overlay races and fails on first run.
#
#   cilium-operator only starts its Gateway API controller when the CRDs exist
#   at startup. On a fresh cluster they are installed here, after the operator
#   is already running, so the operator is restarted once (first install only).
#
# Scope
#   become: false — runs kubectl as the connecting user (kubeconfig at
#   ~/.kube/config). The overlay is the synced copy on the VM.
# =============================================================================

- name: "cluster_config | Check whether Gateway API CRDs already exist"
  become: false
  ansible.builtin.command:
    cmd: kubectl get crd gatewayclasses.gateway.networking.k8s.io
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  register: _deploy_k8s_gateway_api_crd
  changed_when: false
  failed_when: false

- name: "cluster_config | Apply Gateway API CRDs (server-side)"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side -k
      {{ deploy_k8s_k8s_path }}/core/cluster-config/gateway-api
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true

- name: "cluster_config | Wait for Gateway API CRDs to be Established"
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    crds=$(kubectl get crd -o name | grep 'gateway\.networking\.k8s\.io' || true)
    if [ -z "$crds" ]; then
      echo "No Gateway API CRDs found" >&2
      exit 1
    fi
    for crd in $crds; do
      kubectl wait --for=condition=Established "$crd" --timeout={{ deploy_k8s_gateway_api_crd_wait_seconds }}s
    done
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: false

- name: "cluster_config | Restart cilium-operator after the first Gateway API CRD install"
  become: false
  when: _deploy_k8s_gateway_api_crd.rc != 0
  ansible.builtin.shell: |
    set -euo pipefail
    if kubectl -n kube-system get deploy cilium-operator >/dev/null 2>&1; then
      kubectl -n kube-system rollout restart deploy/cilium-operator
      kubectl -n kube-system rollout status deploy/cilium-operator --timeout=180s
    fi
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true

# --force-conflicts: on a re-run these objects already belong to the
# `cluster-config` Application (field manager argocd-controller). Both sides
# apply the same files, so taking the fields back is harmless and Argo CD
# reclaims them on its next sync.
- name: "cluster_config | Apply Cilium + PriorityClasses overlay (server-side)"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts -k
      {{ deploy_k8s_k8s_path }}/core/cluster-config/overlays/{{ deploy_k8s_overlay }}
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true
