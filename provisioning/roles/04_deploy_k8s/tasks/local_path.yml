---
# =============================================================================
# tasks/local_path.yml — Bootstrap deploy of local-path-provisioner (rke2 only)
# =============================================================================
#
# Purpose
#   Deploy local-path-provisioner so the PVCs of Argo CD (redis-ha) can be
#   provisioned before Argo CD exists. Runs only on rke2 (k3s ships its own
#   local-path under kube-system); the caller gates this import with
#   `when: deploy_k8s_is_rke2`.
#
#   1. Namespace local-path-storage with PSA privileged labels — applied via
#      kubectl apply -k from k8s/core/local-path-provisioner/overlays/<overlay>.
#   2. Helm chart (OCI) ghcr.io/rancher/local-path-provisioner — values from
#      k8s/core/local-path-provisioner/base/values.yaml and the overlay
#      values.yaml (priorityClassName pc-0-infra-core exists already: it is
#      created by cluster-config, applied earlier in this role).
#
#   The release name matches the `local-path-provisioner` Application, which
#   adopts these resources once Argo CD takes over.
#
# Variables
#   deploy_k8s_local_path_chart_version — chart version; must match the
#                                         Application targetRevision.
#   deploy_k8s_k8s_path                 — synced k8s/ path on the VM (main.yml).
#
# Node prerequisite
#   The host storage directory (mkdir + chmod 1777 + SELinux container_file_t)
#   is prepared by role 03 (03_install_rke2/tasks/local_path.yml).
# =============================================================================

- name: "local-path | Apply namespace (PSA labels) via Kustomize"
  become: false
  ansible.builtin.command:
    cmd: >-
      kubectl apply -k
      {{ deploy_k8s_k8s_path }}/core/local-path-provisioner/overlays/{{ deploy_k8s_overlay }}
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  changed_when: true

- name: "local-path | Deploy Helm chart (OCI)"
  become: false
  kubernetes.core.helm:
    name: local-path-provisioner
    chart_ref: "{{ deploy_k8s_local_path_chart_ref }}"
    chart_version: "{{ deploy_k8s_local_path_chart_version | default(omit) }}"
    release_namespace: local-path-storage
    values_files:
      - "{{ deploy_k8s_k8s_path }}/core/local-path-provisioner/base/values.yaml"
      - "{{ deploy_k8s_k8s_path }}/core/local-path-provisioner/overlays/{{ deploy_k8s_overlay }}/values.yaml"
    wait: true
