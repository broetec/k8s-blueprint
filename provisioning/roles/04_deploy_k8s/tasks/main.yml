---
# =============================================================================
# tasks/main.yml — Role 04 entrypoint (k8s manifest deploy)
# =============================================================================
#
# Purpose
#   Apply cluster-level Kubernetes resources that must exist before ArgoCD
#   bootstraps the rest. Future manifests under k8s/ will be applied here
#   via kubectl/Helm.
#
# Related commands
#   make install-rke2, make up
# =============================================================================

- name: "Alive check before deploy_k8s"
  become: false
  ansible.builtin.ping:
  tags: [deploy_k8s]

- name: "Placeholder — k8s deploy pending"
  ansible.builtin.debug:
    msg: >-
      04_deploy_k8s: implementation pending.
      Host={{ inventory_hostname }}
      role={{ vm_role | default('n/a') }}.
      Future manifests: k8s/
  tags: [deploy_k8s]
