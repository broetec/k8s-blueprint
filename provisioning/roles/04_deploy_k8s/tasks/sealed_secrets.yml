---
# =============================================================================
# tasks/sealed_secrets.yml — Bootstrap secrets applied before Argo CD
# =============================================================================
#
# Purpose
#   Credentials that cannot come from Git are applied here, straight from the
#   controller (piped through stdin, nothing is left on the VM):
#
#   1. Sealed Secrets controller key (BYOK, label
#      sealedsecrets.bitnami.com/sealed-secrets-key=active). It must exist
#      BEFORE Argo CD installs the controller, so the controller adopts our key
#      and the SealedSecrets sealed offline (seal.yml) are decryptable.
#   2. Cloudflare API token for the letsencrypt-* ClusterIssuers, when the
#      gitignored api-token-secret.yaml exists for the overlay.
#
# DR / reuse
#   The key in env/<overlay>/ is reused across runs (genkey is idempotent), so
#   re-deploys keep the same key. To rotate, delete env/<overlay>/ (or use
#   genkey --force) and re-seal. See k8s/core/sealed-secrets/README.md.
#
# Scope
#   become: false — kubectl runs as the connecting user.
# =============================================================================

- name: "sealed_secrets | Ensure bootstrap namespaces exist"
  become: false
  ansible.builtin.shell:
    cmd: >-
      kubectl create namespace {{ item }}
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  loop:
    - "{{ sealed_secrets_namespace }}"
    - "{{ cert_manager_namespace }}"
  changed_when: true

- name: "sealed_secrets | Pre-apply the active controller key (BYOK)"
  become: false
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.file', deploy_k8s_repo_root + '/' + sealed_secrets_keydir + '/sealed-secrets-key-secret.yaml') }}"
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  no_log: true
  changed_when: true

- name: "sealed_secrets | Apply the Cloudflare API token (when present)"
  become: false
  when: _deploy_k8s_cf_token.stat.exists
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.file', deploy_k8s_cloudflare_token_file) }}"
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  no_log: true
  changed_when: true
