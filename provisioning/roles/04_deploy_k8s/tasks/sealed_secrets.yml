---
# =============================================================================
# tasks/sealed_secrets.yml — Sealed Secrets controller with BYOK key (README §3.1)
# =============================================================================
#
# Purpose
#   Pre-apply the locally generated controller key (label
#   sealedsecrets.bitnami.com/sealed-secrets-key=active) BEFORE installing the
#   chart, so the controller adopts our key instead of generating a new one.
#   This makes the SealedSecrets sealed offline (seal.yml) decryptable.
#
# DR / reuse
#   The key in env/<overlay>/ is reused across runs (genkey is idempotent), so
#   re-deploys keep the same key. To rotate, delete env/<overlay>/ (or use
#   genkey --force) and re-seal. See k8s/sealed-secrets/README.md.
#
# Scope
#   become: false — kubectl/helm run as the connecting user.
# =============================================================================

- name: "sealed_secrets | Copy BYOK controller key Secret to the VM"
  become: false
  ansible.builtin.copy:
    src: "{{ deploy_k8s_repo_root }}/{{ sealed_secrets_keydir }}/sealed-secrets-key-secret.yaml"
    dest: "{{ deploy_k8s_remote_path }}/sealed-secrets-key-secret.yaml"
    mode: "0600"

- name: "sealed_secrets | Ensure namespace {{ sealed_secrets_namespace }} exists"
  become: false
  ansible.builtin.shell:
    cmd: >-
      kubectl create namespace {{ sealed_secrets_namespace }}
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
  changed_when: true

- name: "sealed_secrets | Pre-apply the active controller key (BYOK)"
  become: false
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ deploy_k8s_remote_path }}/sealed-secrets-key-secret.yaml"
  environment:
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
  changed_when: true

- name: "sealed_secrets | Add Helm repo {{ sealed_secrets_repo_name }}"
  become: false
  kubernetes.core.helm_repository:
    name: "{{ sealed_secrets_repo_name }}"
    repo_url: "{{ sealed_secrets_repo_url }}"

- name: "sealed_secrets | Install controller (adopts the pre-applied key)"
  become: false
  kubernetes.core.helm:
    name: sealed-secrets
    chart_ref: "{{ sealed_secrets_repo_name }}/sealed-secrets"
    chart_version: "{{ sealed_secrets_chart_version }}"
    release_namespace: "{{ sealed_secrets_namespace }}"
    create_namespace: true
    values_files:
      - "{{ deploy_k8s_remote_path }}/sealed-secrets/base/values.yaml"
      - "{{ deploy_k8s_remote_path }}/sealed-secrets/overlays/{{ deploy_k8s_overlay }}/values.yaml"
    wait: true
