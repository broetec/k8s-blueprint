---
# =============================================================================
# tasks/sync.yml — Mirror k8s/ on the VM + tooling preflight
# =============================================================================
#
# Purpose
#   Make the k8s/ tree (including the SealedSecrets generated offline by
#   seal.yml) available on the VM: `kubectl apply -k` and Helm value files
#   resolve locally, and the same directory is the working tree published to
#   the local Git read by Argo CD.
#
# Behaviour
#   k8s/ is packed on the controller into one archive and unpacked on the VM
#   after removing the previous copy, so the VM always holds an exact mirror
#   (files deleted locally disappear there too). Plain *-secret.yaml files are
#   left out: only SealedSecrets travel.
#
# Scope
#   Packaging: delegate_to localhost. Everything else: become false, under the
#   connecting user's home.
# =============================================================================

- name: "sync | Preflight — helm, kubectl and git available on the VM"
  become: false
  ansible.builtin.command:
    cmd: "{{ item }}"
  environment:
    PATH: "{{ deploy_k8s_bin_path }}"
  loop:
    - kubectl version --client
    - helm version
    - git --version
  changed_when: false

- name: "sync | Create a temporary archive path (controller)"
  delegate_to: localhost
  become: false
  ansible.builtin.tempfile:
    state: file
    prefix: k8s-blueprint-
    suffix: .tar.gz
  register: _deploy_k8s_archive
  changed_when: false

- name: "sync | Pack k8s/ without plain Secrets (controller)"
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - tar
      - --exclude=*-secret.yaml
      - -czf
      - "{{ _deploy_k8s_archive.path }}"
      - -C
      - "{{ deploy_k8s_repo_root }}"
      - k8s
  changed_when: false

- name: "sync | Ensure remote manifests directory exists"
  become: false
  ansible.builtin.file:
    path: "{{ deploy_k8s_remote_path }}"
    state: directory
    mode: "0755"

- name: "sync | Remove the previous k8s/ copy from the VM"
  become: false
  ansible.builtin.file:
    path: "{{ deploy_k8s_k8s_path }}"
    state: absent
  changed_when: false

- name: "sync | Unpack k8s/ on the VM"
  become: false
  ansible.builtin.unarchive:
    src: "{{ _deploy_k8s_archive.path }}"
    dest: "{{ deploy_k8s_remote_path }}"
  changed_when: false

- name: "sync | Remove the temporary archive (controller)"
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ _deploy_k8s_archive.path }}"
    state: absent
  changed_when: false

- name: "sync | Check the overlay exists in k8s/core/applications"
  become: false
  ansible.builtin.stat:
    path: "{{ deploy_k8s_k8s_path }}/core/applications/overlays/{{ deploy_k8s_overlay }}/kustomization.yaml"
  register: _deploy_k8s_overlay_stat

- name: "sync | Fail early when the overlay has no k8s manifests"
  ansible.builtin.assert:
    that: _deploy_k8s_overlay_stat.stat.exists
    fail_msg: >-
      k8s/core/applications/overlays/{{ deploy_k8s_overlay }} not found. Declare a
      `k8s:` section for the overlay in the inventory manifest and render it with
      `uv run k8s-blueprint overlay render {{ deploy_k8s_overlay }}`.
    quiet: true
